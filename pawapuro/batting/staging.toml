# Startup development staging and reference pitch fixture. Metres; +Y up, +Z toward the pitcher.
# Defaults for omitted keys are defined in staging.hpp; invalid values reject startup.
[window]
width_fraction = 0.75

[camera]
preset = "right_handed_pitcher_vs_left_handed_batter"
# Frame from third-base (-X), opposite the future left-handed batter at +X.
# This presentation camera leaves catcher-view right for the foreground batter.
position_m = [-0.75, 1.55, -5.0]
# No horizontal yaw: target X matches camera X. Lens shift is derived from gameplay focus.
target_m = [-0.75, 1.0713, 16.8]
vertical_fov_degrees = 36.0

[release]
# Right-handed pitcher releases to catcher-view left of the centre axis.
position_m = [-0.65, 2.05, 16.8]
# Intentionally enlarged visual marker, not a physical baseball radius.
ball_marker_radius_m = 0.085

# Gravity-only fixture, approximately 150 km/h; not a tuned pitch model.
# Centre (slot 5) fixture: retain Z speed; solve X/Y for the zone centre with fixed-tick crossing interpolation.
# Derivation and tolerance are recorded in docs/development/environment.md; velocity is the only runtime input.
[reference_pitch]
initial_velocity_mps = [1.654644371, -1.319413788, -41.667]

[field]
grass_half_width_m = 85.0
grass_end_z_m = 140.0
# Flat presentation dirt around home plate, not a raised surface.
home_dirt_radius_m = 2.8

[mound]
# Flat visual apron; independent of the smaller raised mound below.
visual_dirt_radius_m = 5.5
# Raised presentation volume; rubber X/Z distance stays unchanged.
height_m = 0.35
radius_m = 3.5
top_radius_m = 1.5

# Authoritative Pawapuro gameplay strike zone, not a separate visual guide.
# Shared gameplay width also scales the home plate pentagon; depth equals width.
# Revisit dimensions with the stylized batter model, stance and playtesting.
# Width and heights above ground in metres; evaluation plane crosses the plate depth centre.
[strike_zone]
width_m = 0.8636
bottom_m = 0.30
top_m = 1.25

# Static composition fixtures only. Position is the foot/ground origin; height excludes the bat.
[pitcher_blockout]
# Rear-foot origin for the static release pose; height is the standing-proportion scale.
position_m = [0.0, 0.355, 18.5166]
height_m = 2.45

[batter_blockout]
position_m = [1.25, 0.008, 0.0]
height_m = 1.7

# Character Style v1: shared dimensionless multipliers, applied to Native blockout proportions.
# Height remains the overall proportion scale; feet stay grounded as their size changes.
[character_style]
head_scale = 1.08
foot_planar_scale = 1.9
foot_height_scale = 0.9
hand_scale = 1.3
bat_thickness_scale = 1.25

# First gameplay envelope candidate; reality is a consultant, not a permanent rule.
# Independent of the enlarged visual ball marker and rendered bat thickness.
[bat_contact]
ball_radius_m = 0.037
bat_radius_m = 0.033

# Player Aim S0 human-review candidate, not authorization or permanent balance.
[player_aim]
normal_radius_x_m = 0.26
normal_radius_y_m = 0.13
cursor_speed_mps = 0.65
