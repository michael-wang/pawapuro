# Startup development staging and reference pitch fixture. Metres; +Y up, +Z toward the pitcher.
# Defaults for omitted keys are defined in staging.hpp; invalid values reject startup.
[camera]
preset = "right_handed_pitcher_vs_left_handed_batter"
# Frame from third-base (-X), opposite the future left-handed batter at +X.
# This presentation camera leaves catcher-view right for the foreground batter.
position_m = [-0.75, 1.25, -5.0]
# Aim horizontally through (0, arrival_plane_z), keeping the distant pitcher left.
target_m = [2.260052, 1.30, 16.8]
vertical_fov_degrees = 36.0

[release]
# Right-handed pitcher releases to catcher-view left of the centre axis.
position_m = [-0.65, 2.05, 16.8]
# Intentionally enlarged visual marker, not a physical baseball radius.
ball_marker_radius_m = 0.085

# Gravity-only fixture, approximately 150 km/h; not a tuned pitch model.
# Lateral velocity approximately aims the baseline release toward the plate centre.
[reference_pitch]
initial_velocity_mps = [1.655, -0.6, -41.667]

[field]
grass_half_width_m = 85.0
grass_end_z_m = 140.0
# Flat presentation dirt around home plate, not a raised surface.
home_dirt_radius_m = 2.8

[mound]
# Flat visual apron; independent of the smaller raised mound below.
visual_dirt_radius_m = 5.5
# Silhouette tuning only; rubber distance and mound height remain Native references.
radius_m = 2.75
top_radius_m = 0.9

# Authoritative Pawapuro gameplay strike zone, not a separate visual guide.
# Shared gameplay width also scales the home plate pentagon; depth equals width.
# Revisit dimensions with the stylized batter model, stance and playtesting.
# Width and heights above ground in metres; evaluation plane crosses the plate depth centre.
[strike_zone]
width_m = 0.8636
bottom_m = 0.5
top_m = 1.45

# Static composition fixtures only. Position is the foot/ground origin; height excludes the bat.
[pitcher_blockout]
position_m = [0.0, 0.259, 18.5166]
height_m = 1.85

[batter_blockout]
position_m = [1.25, 0.008, 0.0]
height_m = 1.7
